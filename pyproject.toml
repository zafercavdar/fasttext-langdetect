[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fasttext-langdetect"
version = "1.2.0"
description = "80x faster and 95% accurate language identification with fastText"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Zafer Cavdar", email = "zafercvdr@gmail.com" },
]
keywords = [
    "fasttext",
    "langdetect",
    "language-detection",
    "language-identification",
    "nlp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    # The lid.176 models are run with NumPy (see ftlangdetect.model), so
    # fastText itself is not needed. No single NumPy release has wheels for
    # every supported Python (3.9 tops out at 2.0.x, 3.14 starts at 2.3.2),
    # so each floor is the first release with Linux, macOS (arm64) and
    # Windows wheels for that Python.
    "numpy>=1.21.0; python_version < '3.10'",
    "numpy>=1.21.3; python_version == '3.10'",
    "numpy>=1.23.2; python_version == '3.11'",
    "numpy>=1.26.0; python_version == '3.12'",
    "numpy>=2.1.0; python_version == '3.13'",
    "numpy>=2.3.2; python_version >= '3.14'",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "pre-commit>=3.5",
    "build>=1.0",
    # hatchling writes Metadata-Version 2.5, which twine < 7 rejects on upload.
    # twine 7 needs Python 3.10+; publish from 3.10 or newer.
    "twine>=7.0; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/zafercavdar/fasttext-langdetect"
Repository = "https://github.com/zafercavdar/fasttext-langdetect"
Issues = "https://github.com/zafercavdar/fasttext-langdetect/issues"
Changelog = "https://github.com/zafercavdar/fasttext-langdetect/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/ftlangdetect"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ftlangdetect",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "N",      # pep8-naming
    "PL",     # pylint
    "PTH",    # use pathlib
    "TID",    # flake8-tidy-imports
    "ARG",    # unused arguments
    "RET",    # flake8-return
]
ignore = [
    "PLR2004", # magic numbers in tests are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004", # magic numbers
    "S101",    # asserts
    "ARG",     # unused args are common in fixtures and signature-matching test doubles
]

[tool.ruff.lint.isort]
known-first-party = ["ftlangdetect"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["ftlangdetect"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
